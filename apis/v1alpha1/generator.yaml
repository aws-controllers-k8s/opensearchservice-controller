sdk_names:
  model_name: opensearch
  package_name: opensearch
operations:
  # DescribeVpcEndpoints filters by VpcEndpointIds and returns full VpcEndpoint
  # objects, so it is the correct ReadMany op. Without this override the
  # generator would otherwise pick the alphabetically-later ListVpcEndpoints,
  # which lists every endpoint in the account with no identifier filter.
  # output_wrapper_field_path disambiguates the two list members in the output
  # shape (VpcEndpoints vs VpcEndpointErrors).
  DescribeVpcEndpoints:
    operation_type:
      - List
    resource_name: VpcEndpoint
    output_wrapper_field_path: VpcEndpoints
ignore:
  operations:
    # ListVpcEndpoints lists all endpoints with no identifier filter; use
    # DescribeVpcEndpoints (configured above) as the ReadMany op instead.
    - ListVpcEndpoints
  resource_names:
    - Package
    # Index management is a data plane concern, not control plane
    - Index
    # - Domain
    - OutboundConnection
    # - VpcEndpoint
    - Application
  field_paths:
    # SnapshotOptions is irrelevant for OpenSearch 5.3+
    - CreateDomainInput.SnapshotOptions
    - CreateDomainInput.IdentityCenterOptions
    - ClusterConfig.NodeOptions
    - CreateDomainOutput.DomainStatus.IdentityCenterOptions
    # ClientToken is a K8s-irrelevant idempotency token
    - CreateVpcEndpointInput.ClientToken
    # AWS returns PrincipalType as "AWS Account"/"AWS Service", not the modelled
    # enum, so exposing it would drift forever. It is derivable from the principal.
    - AuthorizedPrincipal.PrincipalType
    # Fields the SDK bump brought in. Exposing them needs late_initialize for the
    # ones DescribeDomain returns server-set values for, so they are ignored here.
    - AIMLOptionsInput.S3VectorsEngine
    - AIMLOptionsInput.ServerlessVectorAcceleration
    - AdvancedSecurityOptions.IAMFederationOptions
    - AdvancedSecurityOptionsInput.IAMFederationOptions
    - CreateDomainInput.DeploymentStrategyOptions
    - CreateDomainOutput.DomainStatus.DeploymentStrategyOptions
    - SoftwareUpdateOptions.UseLatestServiceSoftwareForBlueGreen
    - CreateDomainInput.AutomatedSnapshotPauseOptions
    - CreateDomainOutput.DomainStatus.AutomatedSnapshotPauseOptions
    - CreateDomainInput.EngineMode
    - CreateDomainOutput.DomainStatus.EngineMode
    - CreateDomainInput.UseCase
    - CreateDomainOutput.DomainStatus.UseCase
    - JWTOptionsInput.JwksUrl
    - VPCOptions.EgressEnabled
    - VPCDerivedInfo.EgressEnabled
resources:
  Domain:
    renames:
      operations:
        CreateDomain:
          input_fields:
            DomainName: Name
            TagList: Tags
        DeleteDomain:
          input_fields:
            DomainName: Name
        DescribeDomain:
          input_fields:
            DomainName: Name
    synced:
      when:
      - path: Status.DomainProcessingStatus
        in: [ "Active", "Isolated" ]
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
      terminal_codes:
        - ValidationException
    hooks:
      sdk_create_post_set_output:
        template_path: hooks/domain/sdk_create_post_set_output.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/domain/sdk_read_one_post_set_output.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/domain/sdk_update_pre_build_request.go.tpl
      sdk_delete_pre_build_request:
        template_path: hooks/domain/sdk_delete_pre_build_request.go.tpl
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
    fields:
      # DescribeDomain does not return masterUserOptions in the response
      # To prevent a perpetual diff, ignore the fields from comparison
      AdvancedSecurityOptions.MasterUserOptions:
        compare:
          is_ignored: true
      AdvancedSecurityOptions.MasterUserOptions.MasterUserPassword:
        is_secret: true
      AutoTuneOptions.MaintenanceSchedules:
        compare:
          is_ignored: true
      AccessPolicies:
        is_iam_policy: true
      VPCOptions.SubnetIDs:
        references:
          service_name: ec2
          resource: Subnet
          path: Status.SubnetID
      VPCOptions.SecurityGroupIDs:
        references:
          resource: SecurityGroup
          path: Status.ID
          service_name: ec2
      AuthorizedPrincipals:
        from:
          operation: ListVpcEndpointAccess
          path: AuthorizedPrincipalList
        compare:
          is_ignored: true
    update_operation:
      custom_method_name: customUpdateDomain
  VpcEndpoint:
    synced:
      when:
      - path: Status.Status
        in: [ "ACTIVE" ]
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
      terminal_codes:
        - ValidationException
    tags:
      ignore: true
    fields:
      # DomainARN is set at creation and cannot be changed via UpdateVpcEndpoint;
      # a change would orphan the existing endpoint, so treat it as immutable.
      DomainARN:
        references:
          resource: Domain
          path: Status.ACKResourceMetadata.ARN
        is_immutable: true
      VPCOptions.SubnetIDs:
        references:
          service_name: ec2
          resource: Subnet
          path: Status.SubnetID
      VPCOptions.SecurityGroupIDs:
        references:
          service_name: ec2
          resource: SecurityGroup
          path: Status.ID
