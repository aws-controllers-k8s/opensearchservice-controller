resources:
  VPCEndpointAccess:
    fields:
      Principal:
        override: |
          The AWS account or service authorized to access the domain through its
          interface VPC endpoints.

          Either a 12-digit AWS account ID or an AWS service principal (for example
          application.opensearchservice.amazonaws.com). The controller passes it to
          AuthorizeVpcEndpointAccess and RevokeVpcEndpointAccess as the account or the
          service argument accordingly.
      ServiceOptions:
        override: |
          Options that scope the authorization, such as the Regions it applies to.

          When left unset, the domain's own Region is authorized and reported back
          here. Regions can be added or removed afterwards. Removing every Region
          removes the authorization itself, so that is rejected: delete this resource
          instead.
